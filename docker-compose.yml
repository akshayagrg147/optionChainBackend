services:
  db:
    image: redis:7-alpine
    container_name: optionchain_redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5


  web:
    build: .
    container_name: optionchain_web
    command: daphne -b 0.0.0.0 -p 8000 trading.asgi:application
    volumes:
      - .:/app
      - media_files:/app/media
    ports:
      - "8000:8000"
    environment:
      - REDIS_HOST=db
      - REDIS_PORT=6379
      - DJANGO_SETTINGS_MODULE=trading.settings
      - DEBUG=1
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

volumes:
  redis_data:
  media_files:

